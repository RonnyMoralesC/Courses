<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --ink:#1b2026;
  --ink-soft:#5d666f;
  --ink-faint:#8b939b;
  --desk:#d8dbd5;
  --sheet:#fff;
  --line:rgba(27,32,38,.13);
  --line-firm:rgba(27,32,38,.24);
  --serif:"Libre Bodoni","Bodoni MT",Didot,"Times New Roman",serif;
  --sans:Archivo,"Helvetica Neue",Arial,sans-serif;
  --pad:clamp(1.25rem,4vw,2.5rem);
  --accent:var(--ink); /* overridden per course */
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--desk);
  color:var(--ink);
  font:400 1rem/1.6 var(--sans);
  padding:clamp(1.5rem,5vw,4rem) clamp(.75rem,2vw,1.5rem) 5rem;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:78rem;margin:0 auto}

/* ============================================================
   Masthead
   ============================================================ */
.masthead{margin:0 0 clamp(2rem,5vw,3.25rem)}
.masthead h1{
  font:400 clamp(2.4rem,7vw,4rem)/1.02 var(--serif);
  letter-spacing:-.015em;margin:0 0 .6rem;
}
.masthead p{max-width:54ch;margin:0;color:var(--ink-soft);font-size:1.0625rem}
.masthead .byline{
  font:400 1.0625rem/1.4 var(--serif);font-style:italic;
  color:var(--ink-soft);margin:0 0 0.7rem;
}

/* ============================================================
   Course grid (home)
   ============================================================ */
.grid{display:grid;gap:clamp(.9rem,2vw,1.15rem);grid-template-columns:repeat(auto-fill,minmax(21rem,1fr));margin:0;padding:0;list-style:none}
.sheet{
  background:var(--sheet);border:1px solid var(--line);border-radius:2px;
  box-shadow:0 1px 0 rgba(27,32,38,.06),0 10px 18px -16px rgba(27,32,38,.7);
}
.card{position:relative;display:block;text-decoration:none;padding:1.35rem 1.4rem 1.25rem 1.75rem;height:100%;transition:background .15s ease}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.card:hover{background:color-mix(in srgb,var(--accent) 5%,#fff)}
.card:hover .card-title{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.card-title{font:400 1.375rem/1.2 var(--serif);margin:0 0 .1rem;letter-spacing:-.005em}
.card-sub{margin:0;font-size:.8125rem;color:var(--ink-faint)}
.card-blurb{margin:.7rem 0 0;font-size:.9375rem;line-height:1.5;color:var(--ink-soft)}
.card-count{margin:1rem 0 0;font-size:.8125rem;color:var(--ink-faint)}
.mark{flex:none;color:var(--accent)}

/* ============================================================
   Course page
   ============================================================ */
.back{
  display:inline-block;margin:0 0 1.5rem;font-size:.9375rem;color:var(--ink-soft);
  text-decoration:none;border-bottom:1px solid var(--line-firm);padding-bottom:1px;
}
.back:hover{color:var(--ink);border-color:currentColor}

.course-head{display:flex;gap:clamp(1rem,3vw,1.75rem);align-items:flex-start;margin:0 0 2.25rem}
.course-head h2{font:400 clamp(2rem,5.5vw,3rem)/1.05 var(--serif);margin:0 0 .35rem;letter-spacing:-.015em}
.course-head .sub{margin:0;color:var(--ink-faint);font-size:.9375rem}
.course-head .blurb{margin:.75rem 0 0;max-width:58ch;color:var(--ink-soft)}
.mark-lg{flex:none;color:var(--accent);margin-top:.35rem}

section.block{margin:0 0 1.75rem}
.block h3{
  font:600 1rem/1.3 var(--sans);margin:0 0 .75rem;
  display:flex;align-items:baseline;gap:.6rem;
}
.block h3 .tally{font:400 .8125rem/1 var(--sans);color:var(--ink-faint)}

/* Syllabus: the "start here" document */
.syllabus{
  display:flex;flex-wrap:wrap;align-items:center;gap:1rem;justify-content:space-between;
  padding:1.1rem 1.25rem;text-decoration:none;border-radius:2px;
  background:var(--sheet);border:1px solid var(--line-firm);
  background:color-mix(in srgb,var(--accent) 7%,#fff);
  border-color:color-mix(in srgb,var(--accent) 28%,#fff);
}
.syllabus:hover{background:color-mix(in srgb,var(--accent) 12%,#fff)}
.syllabus strong{font-weight:500;display:block}
.syllabus span{font-size:.875rem;color:var(--ink-soft)}
.syllabus .go{font-size:.875rem;color:var(--accent);font-weight:500;white-space:nowrap}

/* Document rows */
.rows{margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:1rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{
  font:400 1.0625rem/1 var(--serif);color:var(--accent);
  min-width:1.4rem;text-align:right;flex:none;font-variant-numeric:lining-nums;
}
.row .name{flex:1 1 auto;min-width:0;text-decoration:none}
.row a.name:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.row .actions{display:flex;gap:.4rem;flex:none}

.btn{
  font:500 .8125rem/1 var(--sans);text-decoration:none;white-space:nowrap;
  padding:.5rem .7rem;border:1px solid var(--line-firm);
  border-color:color-mix(in srgb,var(--accent) 40%,#fff);
  color:var(--accent);border-radius:3px;background:#fff;transition:background .15s ease;
}
.btn:hover{background:color-mix(in srgb,var(--accent) 10%,#fff)}
.btn.pending{
  border-style:dashed;border-color:var(--line-firm);color:var(--ink-faint);
  background:transparent;cursor:default;
}

.empty{padding:1rem 1.25rem;color:var(--ink-faint);font-size:.9375rem}
.bundle{margin:.65rem 0 0;font-size:.875rem}
.bundle a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.bundle a:hover{background:color-mix(in srgb,var(--accent) 9%,#fff)}

/* Mark drawing animation, played once when a course opens */
.draw .stroke{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease forwards}
.draw .pop{opacity:0;animation:pop .4s ease .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}

footer{margin:3.5rem 0 0;padding-top:1.25rem;border-top:1px solid var(--line-firm);color:var(--ink-faint);font-size:.875rem}
footer a{color:var(--ink-soft)}

@media (max-width:34rem){
  .row{flex-wrap:wrap;gap:.6rem 1rem}
  .row .name{flex:1 1 100%;order:2}
  .row .n{order:1}
  .row .actions{order:3;flex:1 1 100%}
  .btn{flex:1 1 auto;text-align:center}
  .course-head{gap:1rem}
}
</style>
</head>

            <path class="stroke" d="M24 8 32 34"/>
            <path class="stroke" d="M16 34q8 5 16 0" stroke-dasharray="3 3" opacity=".55"/>
            <circle class="pop" cx="32" cy="34" r="4.5" fill="currentColor" stroke="none"/>`,
  measure: `<path class="stroke" d="M6 40h36" opacity=".4"/>
            <path class="stroke" d="M6 40V27h8V17h8v14h8V11h8v11h4"/>
            <path class="stroke" d="M6 22h36" stroke-dasharray="3 3" opacity=".55"/>`
};

function markSvg(name, size, cls){
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 48 48" fill="none"
    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${MARKS[name] || ""}</svg>`;
}

/* --- helpers ------------------------------------------------------------ */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const app = document.getElementById("app");
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

/* A real link to a PDF, or a dashed placeholder when the path is missing. */
function fileBtn(path, label, pendingLabel){
  return path
    ? `<a class="btn" href="${esc(path)}" target="_blank" rel="noopener">${esc(label)}</a>`
    : `<span class="btn pending" aria-disabled="true">${esc(pendingLabel)}</span>`;
}

/* --- home --------------------------------------------------------------- */
function renderHome(){
  document.title = SITE.title;
  document.documentElement.style.setProperty("--accent", "var(--ink)");

  const cards = COURSES.map(c => `
    <li class="sheet" style="--accent:${esc(c.color)}">
      <a class="card" href="#/${esc(c.id)}">
        <div class="card-head">
          <div>
            <h2 class="card-title">${esc(c.title)}</h2>
            <p class="card-sub">${esc(c.term || "")}</p>
          </div>
          ${markSvg(c.mark, 40, "mark")}
        </div>
        <p class="card-blurb">${esc(c.blurb)}</p>
        <p class="card-count">${plural(c.slides.length, "slide")}, ${plural(c.sheets.length, "problem sheet")}</p>
      </a>
    </li>`).join("");

  app.innerHTML = `
    <header class="masthead">
      <p class="byline">${esc(SITE.lecturer)}</p>
      <h1>${esc(SITE.title)}</h1>
      <p>${esc(SITE.intro)}</p>
    </header>
    <ul class="grid">${cards}</ul>
    <footer><p>Materials are provided for the students on these courses. Corrections are welcome.</p></footer>`;
}

/* --- course ------------------------------------------------------------- */
function docList(items, emptyMsg){
  if(!items || !items.length) return `<div class="sheet"><p class="empty">${esc(emptyMsg)}</p></div>`;
  const rows = items.map((it, i) => {
    const path = it.file || "";
    const name = path
      ? `<a class="name" href="${esc(path)}" target="_blank" rel="noopener">${esc(it.title)}</a>`
      : `<span class="name">${esc(it.title)}</span>`;
    return `
    <li class="row">
      <span class="n">${i + 1}</span>
      ${name}
      <span class="actions">${fileBtn(path, "Open PDF", "To follow")}</span>
    </li>`;
  }).join("");
  return `<ul class="rows sheet">${rows}</ul>`;
}

function sheetList(items){
  if(!items || !items.length) return `<div class="sheet"><p class="empty">The first problem sheet will appear here once we have covered enough ground.</p></div>`;
  const rows = items.map((s, i) => {
    // "file:" is still understood, and counts as the problem sheet.
    const problems  = s.problems || s.file || "";
    const solutions = s.solutions || "";

    const name = problems
      ? `<a class="name" href="${esc(problems)}" target="_blank" rel="noopener">${esc(s.title)}</a>`
      : `<span class="name">${esc(s.title)}</span>`;

    return `
    <li class="row">
      <span class="n">${i + 1}</span>
      ${name}
      <span class="actions">
        ${fileBtn(problems, "Problem", "Problem coming soon")}
        ${fileBtn(solutions, "Solution", "Solution coming soon")}
      </span>
    </li>`;
  }).join("");
  return `<ul class="rows sheet">${rows}</ul>`;
}

function renderCourse(c){
  document.title = `${c.title} — ${SITE.title}`;
  document.documentElement.style.setProperty("--accent", c.color);

  app.innerHTML = `
    <a class="back" href="#/">All courses</a>
    <header class="course-head">
      ${markSvg(c.mark, 64, "mark-lg draw")}
      <div>
        <h2>${esc(c.title)}</h2>
        <p class="sub">${esc(c.term || "")}</p>
        <p class="blurb">${esc(c.blurb)}</p>
      </div>
    </header>

    <section class="block">
      <h3>Syllabus</h3>
      ${c.syllabus ? `<a class="syllabus" href="${esc(c.syllabus)}" target="_blank" rel="noopener">
        <span><strong>What this course covers</strong>
        <span>Topics, prerequisites, assessment and reading.</span></span>
        <span class="go">Open PDF</span>
      </a>` : `<div class="sheet"><p class="empty">The syllabus will be posted here before the course begins.</p></div>`}
    </section>

    <section class="block">
      <h3>Slides <span class="tally">${plural(c.slides.length, "deck")}</span></h3>
      ${docList(c.slides, "Slides will be posted as the course runs.")}
      ${c.slidesAll && c.slides.length
        ? `<p class="bundle"><a href="${esc(c.slidesAll)}" target="_blank" rel="noopener">All ${c.slides.length} in a single file</a></p>`
        : ""}
    </section>

    <section class="block">
      <h3>Lecture notes <span class="tally">${plural((c.notes || []).length, "file")}</span></h3>
      ${docList(c.notes, "Notes will be posted as the course runs.")}
    </section>

    <section class="block">
      <h3>Problem sheets <span class="tally">${plural(c.sheets.length, "sheet")}</span></h3>
      ${sheetList(c.sheets)}
    </section>

    <footer><p><a href="#/">Back to all courses</a></p></footer>`;

  animateMark();
}

/* One orchestrated moment: the subject mark draws itself when a course opens. */
function animateMark(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  document.querySelectorAll(".draw .stroke").forEach((el, i) => {
    const len = Math.ceil(el.getTotalLength ? el.getTotalLength() : 200);
    el.style.setProperty("--len", len);
    el.style.animationDelay = (i * 0.12) + "s";
  });
}

/* --- routing ------------------------------------------------------------ */
function route(){
  const id = location.hash.replace(/^#\/?/, "");
  const course = COURSES.find(c => c.id === id);
  course ? renderCourse(course) : renderHome();
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
